---
name: CICD
on:
  workflow_dispatch:
    inputs:
      environment:
        description: This is the environment value where this workflow runs
        default: dev
        required: true
        type: choice
        options:
          - dev
          - prod
          - staging
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "COde Clone from GitHub"
  build:
    needs:
      - code
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Container
        run: echo "Docker Container build"
  test:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing the container"
  deploy:
    if: inputs.environment == 'dev'
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the app
        run: echo "Docker compose deployed the app"
  name: Login to Docker Hub
  uses: docker/login-action@v3
  with:
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

  
  name: Build Docker Image
  run: docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:latest .

  name: Push Docker Image
  run: docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest
